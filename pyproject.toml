[project]
name = "ddd-policy-tracer"
version = "0.1.0"
description = "DDD-first policy document acquisition prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bs4>=0.0.2",
    "httpx>=0.28.1",
    "nltk>=3.9.4",
    "fastcoref>=2.1.6",
    "falkordb>=1.2.2",
    "pydantic>=2.13.3",
    "protobuf==3.20.1",
    "pypdf>=6.10.2",
    "scikit-learn>=1.8.0",
    "sentencepiece>=0.2.0",
    "torch>=2.8.0",
    "transformers>=4.57.1",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "sentence-transformers>=5.5.1",
    "sqlite-vec>=0.1.9",
    "aiosqlite>=0.22.1",
    "pandas>=3.0.2",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
    "langchain>=1.3.1",
    "langchain-text-splitters>=1.1.2",
    "umap-learn[plot]>=0.5.12",
    "semantic-chunkers>=0.1.1",
    "pymongo>=4.17.0",
    "gliner2>=1.3.1",
    "chromadb>=1.5.9",
    "neo4j>=6.2.0",
    "pdf-inspector>=0.1.1",
    "graphrag-sdk[all]>=1.2.0",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.4",
    "openai>=2.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "ASYNC", "ANN", "COM", "PT", "RUF", "S", "T", "YTT"]
ignore = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
